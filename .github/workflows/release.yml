name: Release
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
      - name: Extract version from version.go
        id: version
        run: |
          VERSION=$(grep -oP 'Version = "\K[^"]+' version.go)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"
      # A Go module has no publish step: it is "published" simply by the git
      # tag existing, and the module proxy picks it up on first fetch. Only
      # the tag and GitHub Release need creating here.
      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, nothing to do"
            exit 0
          fi

          # The release notes are the CHANGELOG section for this version. Its
          # absence means the CHANGELOG was not updated, which Changelog Check
          # should already have caught, so fail rather than publish empty notes.
          NOTES=$(awk -v ver="## ${VERSION}" '
            $0 == ver { found = 1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md | sed '/^$/d')

          if [ -z "$NOTES" ]; then
            echo "ERROR: no '## ${VERSION}' section found in CHANGELOG.md"
            exit 1
          fi

          gh release create "$TAG" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "$TAG" \
            --notes "$NOTES"
          echo "Created ${TAG} at ${{ github.event.workflow_run.head_sha }}"
